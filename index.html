<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ncar-favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0057c2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the saved color theme before the first paint, so a dark page never flashes
      // white. Keep in sync with src/theme/theme.js.
      ;(function () {
        var preference = 'system'
        try {
          preference = localStorage.getItem('musicbox.themePreference') || 'system'
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>MusicBox Interactive | v%APP_VERSION%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
