name: Build and push container image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

# Each run pushes a commit to the deploy branch.
# Only one run at a time can push, so that two runs do not conflict.
concurrency:
  group: deploy-branch
  cancel-in-progress: false

jobs:
  buildpush:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
    - name: Get short commit SHA
      run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

    # A tag push builds the production image and deploys it to the prod overlay.
    # A branch push builds the development image and deploys it to the devel overlay.
    # Each build has a different Google Analytics ID, so the two builds must not share an image tag.
    - name: Select build target
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "GA_ID=G-J6GE4Q3QZ2" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "OVERLAY=prod" >> $GITHUB_ENV
        else
          echo "GA_ID=G-CFFKTT2B6Y" >> $GITHUB_ENV
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_ENV
          echo "OVERLAY=devel" >> $GITHUB_ENV
        fi

    - name: Checkout Repo
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref_name }}
        path: repo
        fetch-depth: 0

    - name: Checkout Deploy Branch
      uses: actions/checkout@v5
      with:
        ref: deploy
        path: deploy
        fetch-depth: 0

    - name: Login to Docker Registry
      uses: docker/login-action@v4
      with:
        registry: hub.k8s.ucar.edu/musicbox
        username: ${{ secrets.hub_user }}
        password: ${{ secrets.hub_password }}

    - name: BuildPush Frontend
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: |
          hub.k8s.ucar.edu/musicbox/frontend:${{ env.IMAGE_TAG }}
          hub.k8s.ucar.edu/musicbox/frontend:${{ github.ref_name }}
        build-args: |
          VITE_GA_ID=${{ env.GA_ID }}
        file: repo/Dockerfile
        context: repo/

    # The deploy branch holds the image tag that runs in each overlay.
    # The copy from the repo replaces those tags, so this step records them first and then puts them back.
    - name: Sync kustomization manifests to deploy branch
      run: |
        declare -A TAGS
        for overlay in deploy/deploy/kustomization/overlays/*/; do
          name=$(basename "$overlay")
          tag=$(yq '.images[] | select(.name == "hub.k8s.ucar.edu/musicbox/frontend") | .newTag' "$overlay/kustomization.yaml")
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            TAGS[$name]=$tag
          fi
        done
        cp -r repo/deploy/kustomization/. deploy/deploy/kustomization/
        for name in "${!TAGS[@]}"; do
          if [ -d "deploy/deploy/kustomization/overlays/$name" ]; then
            (cd "deploy/deploy/kustomization/overlays/$name" && \
              kustomize edit set image hub.k8s.ucar.edu/musicbox/frontend=hub.k8s.ucar.edu/musicbox/frontend:${TAGS[$name]})
          fi
        done

    - name: Update ${{ env.OVERLAY }} kustomization
      run: |
        cd deploy/deploy/kustomization/overlays/${{ env.OVERLAY }}
        kustomize edit set image  hub.k8s.ucar.edu/musicbox/frontend=hub.k8s.ucar.edu/musicbox/frontend:${{ env.IMAGE_TAG }}
        git config user.email "kshores@ucar.edu"
        git config user.name "Auto-ci"
        git add -A ../../
        git commit -m "CI updating ${{ env.OVERLAY }} kustomization image tag to ${{ env.IMAGE_TAG }}"
        git push origin HEAD:deploy
