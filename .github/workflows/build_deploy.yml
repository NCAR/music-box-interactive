name: Build and push container image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  buildpush:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
    - name: Get short commit SHA
      run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

    - name: Checkout Repo
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref_name }}
        path: repo
        fetch-depth: 0

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: hub.k8s.ucar.edu/musicbox
        username: ${{ secrets.hub_user }}
        password: ${{ secrets.hub_password }}

    - name: BuildPush Backend
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          hub.k8s.ucar.edu/musicbox/backend:${{ env.SHORT_SHA }}
          hub.k8s.ucar.edu/musicbox/backend:${{ github.ref_name }}
        file: repo/backend/docker/Dockerfile
        context: repo/
    
    - name: BuildPush Frontend
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          hub.k8s.ucar.edu/musicbox/frontend:${{ env.SHORT_SHA }}
          hub.k8s.ucar.edu/musicbox/frontend:${{ github.ref_name }}
        file: repo/frontend/Dockerfile
        context: repo/frontend/
