apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    cert-manager.io/cluster-issuer: incommon
spec:
  ingressClassName: nginx-external
  # Each overlay replaces the host and the TLS secret, so that two overlays do not claim the same host.
  tls:
  - hosts:
    - musicbox.k8s.ucar.edu
    - musicbox-cname.k8s.ucar.edu
    secretName: musicbox-tls-secret
  rules:
  - host: musicbox.k8s.ucar.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: musicbox-cname.k8s.ucar.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
